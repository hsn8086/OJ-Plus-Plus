<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>OJ++ 演示题目</title>
<style>
  body { margin: 0; background: #f5f6f7; color: #252a30; font: 16px/1.7 system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; background: #222b30; color: white; }
  .header-right { display: flex; align-items: center; }
  main { margin: 30px auto; padding: 24px 36px; max-width: 900px; background: white; border-radius: 8px; }
  h2 { font-size: 20px; }
  pre { white-space: pre-wrap; font: inherit; }
  img { vertical-align: middle; }
</style>
<header class="header-bar"><strong>OJ++ · 演示题面</strong><div class="header-right">比赛主页</div></header>
<main>
  <h1>A. Sum of two numbers</h1>
  <h2 class="subject-item-title">题目描述</h2>
  <!-- 牛客新版把公式渲染成 KaTeX，真正的 LaTeX 只在 annotation 里 -->
  <div class="subject-question">
    <p>Given two integers <span class="katex"><span class="katex-mathml"><math><semantics><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow><annotation encoding="application/x-tex">a+b</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="mord mathnormal">a</span><span class="mbin">+</span><span class="mord mathnormal">b</span></span></span></span>, find their sum.</p>
    <p>For all <span class="katex"><span class="katex-mathml"><math><semantics><mrow><msub><mi>a</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">a_i \le 10^9</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="mord mathnormal">i</span></span></span><span class="mrel">≤</span><span class="mord">1</span><span class="mord">0</span><span class="msupsub"><span class="mord">9</span></span></span></span></span> print the result on one line.</p>
    <p><span class="katex-display"><span class="katex"><span class="katex-mathml"><math><semantics><mrow><mi>O</mi><mo>(</mo><mi>n</mi><mo>)</mo></mrow><annotation encoding="application/x-tex">O(n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="mord mathnormal">O</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mclose">)</span></span></span></span></span></p>
  </div>
  <div class="subject-describe">
    <h2>输入描述</h2><pre>Two integers <img src="https://www.nowcoder.com/equation?tex=a_i%20%5Cle%2010%5E9" alt="a_i \le 10^9">.</pre>
    <h2>输出描述</h2><pre>Print the sum.</pre>
    <!-- 示例块里的“说明”和输入/输出并列，但不在 .subject-describe 的直接子元素层级里 -->
    <div class="question-oi">
      <div class="question-oi-hd">示例1</div>
      <div class="question-oi-bd">
        <div class="question-oi-mod">
          <h2>输入</h2>
          <div class="question-oi-cont"><pre>1 2</pre></div>
        </div>
        <div class="question-oi-mod">
          <h2>输出</h2>
          <div class="question-oi-cont"><pre>3</pre></div>
        </div>
        <div class="question-oi-mod">
          <h2>说明</h2>
          <div class="question-oi-cont"><pre>Pick 5 as the meeting point.</pre></div>
        </div>
      </div>
    </div>
  </div>
</main>
</html>
